<!DOCTYPE html>
<html>
<head><title>Login - SruthiVerse</title>
<style>
body{font-family:sans-serif; background:#f3f0ff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.box{background:white; padding:30px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.1); width:320px; text-align:center;}
input{width:90%; padding:10px; margin:10px 0; border-radius:8px; border:1px solid #ddd;}
button{width:95%; padding:10px; background:#6a5af9; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;}
a{color:#6a5af9; text-decoration:none;}
</style>
</head>
<body>
<div class="box">
<h2>Welcome to SruthiVerse 💜</h2>
<form method="POST">
{% csrf_token %}
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p>No account? <a href="/register/">Register here</a></p>
<p><a href="/">Back to Home</a></p>
</div>
</body>
</html>
