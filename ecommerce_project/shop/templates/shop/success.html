<!DOCTYPE html>
<html>
<head>
    <title>Order Success</title>
    <style>
        body { font-family: Arial; text-align: center; padding-top: 100px; background: #f0fff0; }
        .box { background: white; padding: 40px; border-radius: 20px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #28a745; }
        .btn { background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉 Order Placed Successfully! 🎉</h1>
        <p>Thank you for shopping with us!</p>
        <h3>Total Paid: ₹{{ total }}</h3>
        <br>
        <a href="/" class="btn">Continue Shopping</a>
    </div>
</body>
</html>
